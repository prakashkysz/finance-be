spring.application.name=finance
# Hosting platforms (Render, Railway, Heroku...) inject the port to listen on through PORT
server.port=${PORT:8080}

# Demo project: secrets are kept in this file. An environment variable with the same name overrides each value.

# PostgreSQL (Neon, production branch)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-young-flower-b5sr4as8-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_H3DJ1IUyCPNB}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate (schema is owned by Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway (set DB_DIRECT_URL to run migrations over a non-pooled endpoint, e.g. on Neon)
spring.flyway.enabled=true
spring.flyway.url=${DB_DIRECT_URL:jdbc:postgresql://ep-young-flower-b5sr4as8.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration

# Error responses must never leak internals
server.error.include-stacktrace=never
server.error.include-message=never

# Security
app.security.jwt.secret=${JWT_SECRET:jfwf8zm9v3FACkQfhav/r+cibII/JlSQJ/M9PY9y/Wd4mZav8dguIyNkfREitpuEYGW2xOxrCDCT36MCo/gC0g==}
app.security.jwt.issuer=finance-api
app.security.jwt.access-token-validity=15m
app.security.jwt.refresh-token-validity=7d
app.security.login.max-failed-attempts=5
app.security.login.lock-duration=15m
app.security.pan-hash-secret=${PAN_HASH_SECRET:he9ow4eGdT9+mrgF5H6ubaLzPaTWuFirYRgRcowS94E=}

# Credit score reports are reused for this long before a fresh bureau enquiry is made
app.credit-score.report-validity=30d

# CORS: comma-separated origins; "*" is allowed inside a pattern to match every Vercel deployment URL of this project
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://finance-*-demo-f294.vercel.app}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
